<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tetris Base — тетрис в одном файле</title>
<style>
  :root {
    --ink: #e8f4ff;
    --dim: #9db7d8;
    --muted: #6a86b3;
    --accent: #4fc3ff;
    --danger: #ff5d5d;
    --bg: #070b16;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: radial-gradient(circle at 50% 0%, #16243c 0%, var(--bg) 60%);
    color: var(--ink);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  .game-shell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin: auto;
  }

  /* Ширина подбирается так, чтобы шахта целиком влезала в экран. */
  .panel {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: min(86vw, 300px, max(200px, calc((100vh - 160px) / 2)));
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 2px;
  }

  .topbar__block--right { text-align: right; }

  .topbar__label {
    display: block;
    font-size: 9px;
    letter-spacing: .26em;
    color: var(--muted);
  }

  .topbar__value {
    display: block;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.15;
    text-shadow: 0 2px 0 rgba(0, 0, 0, .55);
  }

  .topbar__value--lines { color: #ffd166; }

  #game {
    position: relative;
    background: #080c16;
    box-shadow: 0 0 0 3px #2a4670, 0 0 0 6px #0a1221, 0 18px 44px rgba(0, 0, 0, .6);
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    touch-action: none;
  }

  /* Появляется только после проигрыша. */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 20px;
    text-align: center;
    background: rgba(6, 10, 20, .88);
    animation: fade-in .18s ease-out;
  }

  .overlay[hidden] { display: none; }

  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .overlay__tag {
    margin: 0;
    font-size: 9px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .overlay__title {
    margin: 0;
    font-size: clamp(24px, 9vw, 34px);
    line-height: 1.05;
    letter-spacing: .04em;
    color: var(--danger);
    text-shadow: 3px 3px 0 #3a0f16;
  }

  .overlay__text {
    margin: 0;
    font-size: 11px;
    line-height: 1.7;
    color: var(--dim);
  }

  .btn {
    margin-top: 6px;
    padding: 12px 26px;
    border: 0;
    border-radius: 2px;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #04121f;
    background: var(--accent);
    box-shadow: 0 4px 0 #1b6c96;
    cursor: pointer;
    transition: background .12s ease, transform .06s ease, box-shadow .06s ease;
  }

  .btn:hover { background: #6fd2ff; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1b6c96; }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .hint {
    margin: 0;
    max-width: 34ch;
    font-size: 10px;
    line-height: 1.7;
    text-align: center;
    color: var(--muted);
  }

  .hint b { color: var(--dim); }
</style>
</head>
<body>
  <main class="game-shell">
    <div class="panel">
      <div class="topbar">
        <div class="topbar__block">
          <span class="topbar__label">SCORE</span>
          <span class="topbar__value" id="score">0</span>
        </div>
        <div class="topbar__block topbar__block--right">
          <span class="topbar__label">LINES</span>
          <span class="topbar__value topbar__value--lines" id="lines">0</span>
        </div>
      </div>

      <div id="game">
        <canvas id="board" width="240" height="480" aria-label="Игровое поле: шахта 10 на 20 клеток"></canvas>

        <div class="overlay" id="overlay" hidden>
          <p class="overlay__tag">результат</p>
          <h1 class="overlay__title">GAME OVER</h1>
          <p class="overlay__text" id="overlay-text">СЧЁТ 0 · ЛИНИЙ 0</p>
          <button class="btn" id="start-btn" type="button">ЗАНОВО</button>
        </div>
      </div>
    </div>

    <p class="hint">
      <b>← →</b> или <b>A / D</b> — движение · <b>↑</b> — поворот · <b>↓</b> — падение быстрее
    </p>
  </main>

<script>
(function () {
  'use strict';

  // --- Элементы страницы ----------------------------------------------------
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var overlay = document.getElementById('overlay');
  var overlayText = document.getElementById('overlay-text');
  var startBtn = document.getElementById('start-btn');
  var scoreEl = document.getElementById('score');
  var linesEl = document.getElementById('lines');

  // --- Размеры --------------------------------------------------------------
  var COLS = 10;          // ширина шахты
  var ROWS = 20;          // высота шахты
  var CELL = 24;          // размер клетки в пикселях
  var W = COLS * CELL;    // 240
  var H = ROWS * CELL;    // 480

  // --- Настройки ------------------------------------------------------------
  var DROP_INTERVAL = 0.7;    // автоматическое падение: клетка за 0.7 сек
  var SOFT_INTERVAL = 0.06;   // ускоренное падение при зажатой стрелке вниз
  var LINE_SCORES = [0, 100, 300, 500, 800]; // очки за 1, 2, 3 и 4 линии

  // --- Фигуры: семь классических тетромино ----------------------------------
  // Точка — пустая клетка, буква — блок своего цвета.
  var SHAPES = {
    I: ['....',
        'IIII',
        '....',
        '....'],
    O: ['OO',
        'OO'],
    T: ['.T.',
        'TTT',
        '...'],
    S: ['.SS',
        'SS.',
        '...'],
    Z: ['ZZ.',
        '.ZZ',
        '...'],
    J: ['J..',
        'JJJ',
        '...'],
    L: ['..L',
        'LLL',
        '...']
  };

  var COLORS = {
    I: { base: '#3ad6e0', light: '#a9f2f7', dark: '#12646c' },
    O: { base: '#f2c94c', light: '#ffe89a', dark: '#7a5c10' },
    T: { base: '#b06bd6', light: '#e2b6f6', dark: '#502a66' },
    S: { base: '#5ecb6b', light: '#b6f2bd', dark: '#226b2c' },
    Z: { base: '#e2534f', light: '#ffb3b0', dark: '#6e1f1d' },
    J: { base: '#4f7fe2', light: '#b3c8ff', dark: '#1d3a78' },
    L: { base: '#e59a3c', light: '#ffd39a', dark: '#7a4a12' }
  };

  // --- Состояние игры -------------------------------------------------------
  var board = createBoard();
  var piece = null;
  var bag = [];
  var score = 0;
  var lines = 0;
  var state = 'playing';   // 'playing' | 'over'
  var dropTimer = 0;
  var softDrop = false;
  var lastFrame = 0;

  // --- Поле -----------------------------------------------------------------
  function createBoard() {
    var rows = [];
    for (var y = 0; y < ROWS; y++) {
      var row = [];
      for (var x = 0; x < COLS; x++) row.push(null);
      rows.push(row);
    }
    return rows;
  }

  function copyMatrix(shape) {
    var matrix = [];
    for (var y = 0; y < shape.length; y++) {
      matrix.push(shape[y].split(''));
    }
    return matrix;
  }

  // «Мешок» из семи фигур: каждая выпадает по разу, прежде чем повториться.
  function nextType() {
    if (bag.length === 0) {
      bag = Object.keys(SHAPES);
      for (var i = bag.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = bag[i];
        bag[i] = bag[j];
        bag[j] = tmp;
      }
    }
    return bag.pop();
  }

  function createPiece(type) {
    var matrix = copyMatrix(SHAPES[type]);
    return {
      type: type,
      matrix: matrix,
      x: Math.floor((COLS - matrix.length) / 2),
      y: 0
    };
  }

  // Может ли фигура стоять в позиции (px, py)?
  function collides(matrix, px, py) {
    for (var y = 0; y < matrix.length; y++) {
      for (var x = 0; x < matrix[y].length; x++) {
        if (matrix[y][x] === '.') continue;

        var bx = px + x;
        var by = py + y;

        if (bx < 0 || bx >= COLS || by >= ROWS) return true;
        if (by >= 0 && board[by][bx]) return true;
      }
    }
    return false;
  }

  // --- Движение и поворот ---------------------------------------------------
  function move(dx) {
    if (state !== 'playing' || !piece) return;
    if (!collides(piece.matrix, piece.x + dx, piece.y)) {
      piece.x += dx;
    }
  }

  function rotateMatrix(matrix) {
    var n = matrix.length;
    var rotated = [];
    for (var y = 0; y < n; y++) {
      var row = [];
      for (var x = 0; x < n; x++) {
        row.push(matrix[n - 1 - x][y]);
      }
      rotated.push(row);
    }
    return rotated;
  }

  function rotate() {
    if (state !== 'playing' || !piece) return;

    var rotated = rotateMatrix(piece.matrix);
    var kicks = [0, -1, 1, -2, 2];   // простые «пинки» от стен

    for (var i = 0; i < kicks.length; i++) {
      if (!collides(rotated, piece.x + kicks[i], piece.y)) {
        piece.matrix = rotated;
        piece.x += kicks[i];
        return;
      }
    }
  }

  // --- Падение, фиксация, линии --------------------------------------------
  function stepDown() {
    if (!collides(piece.matrix, piece.x, piece.y + 1)) {
      piece.y += 1;
    } else {
      lockPiece();
    }
  }

  function merge() {
    for (var y = 0; y < piece.matrix.length; y++) {
      for (var x = 0; x < piece.matrix[y].length; x++) {
        if (piece.matrix[y][x] === '.') continue;
        board[piece.y + y][piece.x + x] = piece.type;
      }
    }
  }

  // Убирает заполненные ряды и возвращает их количество.
  function clearLines() {
    var cleared = 0;

    for (var y = ROWS - 1; y >= 0; y--) {
      var full = true;
      for (var x = 0; x < COLS; x++) {
        if (!board[y][x]) {
          full = false;
          break;
        }
      }

      if (full) {
        board.splice(y, 1);
        board.unshift(createEmptyRow());
        cleared += 1;
        y += 1;   // на этом месте теперь новый ряд — проверим его снова
      }
    }

    return cleared;
  }

  function createEmptyRow() {
    var row = [];
    for (var x = 0; x < COLS; x++) row.push(null);
    return row;
  }

  function lockPiece() {
    merge();

    var cleared = clearLines();
    if (cleared > 0) {
      score += LINE_SCORES[cleared];
      lines += cleared;
      updateHud();
    }

    spawnPiece();
  }

  function spawnPiece() {
    piece = createPiece(nextType());
    dropTimer = 0;

    // Новая фигура не поместилась — шахта заполнена, игра окончена.
    if (collides(piece.matrix, piece.x, piece.y)) {
      piece = null;
      gameOver();
    }
  }

  function gameOver() {
    state = 'over';
    softDrop = false;
    overlayText.textContent = 'СЧЁТ ' + score + ' · ЛИНИЙ ' + lines;
    overlay.hidden = false;
  }

  function startGame() {
    board = createBoard();
    score = 0;
    lines = 0;
    dropTimer = 0;
    softDrop = false;
    state = 'playing';

    overlay.hidden = true;
    startBtn.blur();
    updateHud();
    spawnPiece();
  }

  function updateHud() {
    scoreEl.textContent = String(score);
    linesEl.textContent = String(lines);
  }

  // --- Логика кадра ---------------------------------------------------------
  function update(dt) {
    if (state !== 'playing' || !piece) return;

    dropTimer += dt;
    var interval = softDrop ? SOFT_INTERVAL : DROP_INTERVAL;

    if (dropTimer >= interval) {
      dropTimer = 0;
      stepDown();
    }
  }

  // --- Отрисовка ------------------------------------------------------------
  function drawBlock(cx, cy, colors) {
    var x = cx * CELL;
    var y = cy * CELL;

    ctx.fillStyle = colors.dark;
    ctx.fillRect(x, y, CELL, CELL);

    ctx.fillStyle = colors.base;
    ctx.fillRect(x + 2, y + 2, CELL - 4, CELL - 4);

    ctx.fillStyle = colors.light;
    ctx.fillRect(x + 2, y + 2, CELL - 4, 3);
    ctx.fillRect(x + 2, y + 2, 3, CELL - 4);
  }

  function drawGrid() {
    ctx.strokeStyle = 'rgba(160, 200, 255, 0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath();

    for (var x = 1; x < COLS; x++) {
      ctx.moveTo(x * CELL + 0.5, 0);
      ctx.lineTo(x * CELL + 0.5, H);
    }
    for (var y = 1; y < ROWS; y++) {
      ctx.moveTo(0, y * CELL + 0.5);
      ctx.lineTo(W, y * CELL + 0.5);
    }

    ctx.stroke();
  }

  function render() {
    ctx.fillStyle = '#080c16';
    ctx.fillRect(0, 0, W, H);

    drawGrid();

    // Упавшие блоки
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        if (board[y][x]) drawBlock(x, y, COLORS[board[y][x]]);
      }
    }

    // Текущая фигура
    if (piece && state === 'playing') {
      for (var py = 0; py < piece.matrix.length; py++) {
        for (var px = 0; px < piece.matrix[py].length; px++) {
          if (piece.matrix[py][px] === '.') continue;
          drawBlock(piece.x + px, piece.y + py, COLORS[piece.type]);
        }
      }
    }
  }

  // --- Управление -----------------------------------------------------------
  function onKeyDown(event) {
    if (event.code === 'ArrowLeft' || event.code === 'KeyA') {
      event.preventDefault();
      move(-1);
    } else if (event.code === 'ArrowRight' || event.code === 'KeyD') {
      event.preventDefault();
      move(1);
    } else if (event.code === 'ArrowUp' || event.code === 'KeyW') {
      event.preventDefault();
      if (!event.repeat) rotate();
    } else if (event.code === 'ArrowDown' || event.code === 'KeyS') {
      event.preventDefault();
      softDrop = true;
    } else if (event.code === 'Space' || event.code === 'Enter') {
      // Пробел не должен прокручивать страницу
      event.preventDefault();
      if (state === 'over') startGame();
    }
  }

  function onKeyUp(event) {
    if (event.code === 'ArrowDown' || event.code === 'KeyS') {
      softDrop = false;
    }
  }

  // Если окно потеряло фокус, ускорение падения не должно «залипнуть»
  function onBlur() {
    softDrop = false;
  }

  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', onBlur);

  startBtn.addEventListener('click', function (event) {
    event.preventDefault();
    startGame();
  });

  // --- Главный цикл ---------------------------------------------------------
  function loop(now) {
    if (!lastFrame) lastFrame = now;
    var dt = (now - lastFrame) / 1000;
    lastFrame = now;

    // Защита от огромного шага после переключения вкладки
    if (dt > 0.05) dt = 0.05;

    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  // Игра начинается сразу: пустая шахта и первая фигура сверху.
  startGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
