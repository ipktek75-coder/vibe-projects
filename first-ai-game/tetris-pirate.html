<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пиратский тетрис — Tetris Pirate</title>
<style>
  :root {
    --ink: #3b2a1c;
    --dim: #6b533a;
    --muted: #6f5940;
    --accent: #c9971f;
    --danger: #9b3327;
    --bg: #e2cca6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background:
      repeating-linear-gradient(45deg, rgba(122, 88, 52, .035) 0 2px, rgba(122, 88, 52, 0) 2px 7px),
      radial-gradient(circle at 50% 0%, #fdf7ea 0%, #f0e2c8 58%, var(--bg) 100%);
    color: var(--ink);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  .game-shell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin: auto;
  }

  /* Ширина подбирается так, чтобы шахта целиком влезала в экран. */
  .panel {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: min(86vw, 300px, max(200px, calc((100vh - 160px) / 2)));
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 2px;
  }

  .topbar__block--right { text-align: right; }

  .topbar__label {
    display: block;
    font-size: 10px;
    letter-spacing: .26em;
    color: var(--muted);
  }

  .topbar__label::before {
    content: '';
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-right: 7px;
    border-radius: 50%;
    background: #c9971f;
    box-shadow: inset 0 0 0 1px #8a6512;
    vertical-align: 1px;
  }

  .topbar__block--right .topbar__label::before {
    background: #7b3f4e;
    box-shadow: inset 0 0 0 1px #4a222d;
  }

  .topbar__value {
    display: block;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.15;
    text-shadow: 0 1px 0 rgba(255, 255, 255, .9);
  }

  .topbar__value--lines { color: #8f5d0b; }

  #game {
    position: relative;
    background: #fbf3e2;
    box-shadow:
      0 0 0 3px #c9971f,
      0 0 0 9px #8a5a33,
      0 0 0 11px #5c3a1e,
      0 16px 30px rgba(92, 58, 30, .28);
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    touch-action: none;
  }

  /* Появляется только после проигрыша. */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 20px;
    text-align: center;
    background: rgba(251, 243, 226, .96);
    backdrop-filter: blur(3px);
    animation: fade-in .18s ease-out;
  }

  .overlay[hidden] { display: none; }

  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .overlay__tag {
    margin: 0;
    font-size: 9px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .overlay__emblem {
    width: 58px;
    height: 58px;
    margin-bottom: 2px;
  }

  .overlay__title {
    margin: 0;
    font-size: clamp(24px, 9vw, 34px);
    line-height: 1.05;
    letter-spacing: .04em;
    color: var(--danger);
    text-shadow: 3px 3px 0 #e8d3b0;
  }

  .overlay__text {
    margin: 0;
    font-size: 11px;
    line-height: 1.7;
    color: var(--dim);
  }

  .btn {
    margin-top: 6px;
    padding: 12px 26px;
    border: 0;
    border-radius: 2px;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #2b1a08;
    background: var(--accent);
    box-shadow: 0 4px 0 #8a6512;
    cursor: pointer;
    transition: background .12s ease, transform .06s ease, box-shadow .06s ease;
  }

  .btn:hover { background: #d9a92c; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #8a6512; }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .hint {
    margin: 0;
    max-width: 34ch;
    font-size: 10px;
    line-height: 1.7;
    text-align: center;
    color: var(--dim);
  }

  .hint b { color: var(--ink); }
</style>
</head>
<body>
  <main class="game-shell">
    <div class="panel">
      <div class="topbar">
        <div class="topbar__block">
          <span class="topbar__label">ДУБЛОНЫ</span>
          <span class="topbar__value" id="score">0</span>
        </div>
        <div class="topbar__block topbar__block--right">
          <span class="topbar__label">ПАЛУБЫ</span>
          <span class="topbar__value topbar__value--lines" id="lines">0</span>
        </div>
      </div>

      <div id="game">
        <canvas id="board" width="240" height="480" aria-label="Пиратское игровое поле: шахта 10 на 20 клеток"></canvas>

        <div class="overlay" id="overlay" hidden>
          <svg class="overlay__emblem" viewBox="0 0 56 56" aria-hidden="true">
            <g stroke="#6b4423" stroke-width="4" stroke-linecap="round" fill="none">
              <path d="M10 46 L46 10" />
              <path d="M46 46 L10 10" />
            </g>
            <g fill="#6b4423">
              <circle cx="8" cy="48" r="3.2" />
              <circle cx="48" cy="8" r="3.2" />
              <circle cx="48" cy="48" r="3.2" />
              <circle cx="8" cy="8" r="3.2" />
            </g>
            <circle cx="28" cy="21.5" r="11" fill="#f8eed8" stroke="#6b4423" stroke-width="2.4" />
            <path d="M22.2 29 h11.6 v4.2 a4.5 4.5 0 0 1 -4.5 4.5 h-2.6 a4.5 4.5 0 0 1 -4.5 -4.5 z"
                  fill="#f8eed8" stroke="#6b4423" stroke-width="2.2" />
            <circle cx="24.2" cy="20" r="2.5" fill="#6b4423" />
            <circle cx="31.8" cy="20" r="2.5" fill="#6b4423" />
            <path d="M28 24 l2.7 3 l-5.4 0 z" fill="#6b4423" />
            <g stroke="#6b4423" stroke-width="1.5" fill="none">
              <path d="M25.4 33.2 v3" />
              <path d="M28 33.2 v3" />
              <path d="M30.6 33.2 v3" />
            </g>
          </svg>
          <p class="overlay__tag">йо-хо-хо!</p>
          <h1 class="overlay__title">GAME OVER</h1>
          <p class="overlay__text" id="overlay-text">ДУБЛОНОВ 0 · ПАЛУБ 0</p>
          <button class="btn" id="start-btn" type="button">ЗАНОВО</button>
        </div>
      </div>
    </div>

    <p class="hint">
      <b>← →</b> или <b>A / D</b> — руль · <b>↑</b> — поворот · <b>↓</b> — падение быстрее
    </p>
  </main>

<script>
(function () {
  'use strict';

  // --- Элементы страницы ----------------------------------------------------
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var overlay = document.getElementById('overlay');
  var overlayText = document.getElementById('overlay-text');
  var startBtn = document.getElementById('start-btn');
  var scoreEl = document.getElementById('score');
  var linesEl = document.getElementById('lines');

  // --- Размеры --------------------------------------------------------------
  var COLS = 10;          // ширина шахты
  var ROWS = 20;          // высота шахты
  var CELL = 24;          // размер клетки в пикселях
  var W = COLS * CELL;    // 240
  var H = ROWS * CELL;    // 480

  // --- Настройки ------------------------------------------------------------
  var DROP_INTERVAL = 0.7;    // автоматическое падение: клетка за 0.7 сек
  var SOFT_INTERVAL = 0.06;   // ускоренное падение при зажатой стрелке вниз
  var LINE_SCORES = [0, 100, 300, 500, 800]; // очки за 1, 2, 3 и 4 линии

  // --- Фигуры: семь классических тетромино ----------------------------------
  // Точка — пустая клетка, буква — блок своего цвета.
  var SHAPES = {
    I: ['....',
        'IIII',
        '....',
        '....'],
    O: ['OO',
        'OO'],
    T: ['.T.',
        'TTT',
        '...'],
    S: ['.SS',
        'SS.',
        '...'],
    Z: ['ZZ.',
        '.ZZ',
        '...'],
    J: ['J..',
        'JJJ',
        '...'],
    L: ['..L',
        'LLL',
        '...']
  };

  // Цвета блоков: у каждого — свой пиратский символ
  var COLORS = {
    I: { base: '#2f6f7d', light: '#8fb9c0', dark: '#1b4750', icon: '#f6ead3' },  // флаг
    O: { base: '#d6a326', light: '#f0cf7a', dark: '#8a610f', icon: '#7a5310' },  // монета
    T: { base: '#7b3f4e', light: '#b87f8c', dark: '#4a222d', icon: '#f6ead3' },  // череп
    S: { base: '#5f7a3f', light: '#9db878', dark: '#3a5024', icon: '#f4e4bd' },  // карта
    Z: { base: '#b5482f', light: '#e08a6f', dark: '#77291a', icon: '#f6ead3' },  // сабля
    J: { base: '#8a5a33', light: '#c0916a', dark: '#573619', icon: '#f6ead3' },  // якорь
    L: { base: '#3f8f8a', light: '#8fc9c5', dark: '#24615d', icon: '#f6ead3' }   // компас
  };

  // --- Состояние игры -------------------------------------------------------
  var board = createBoard();
  var piece = null;
  var bag = [];
  var score = 0;
  var lines = 0;
  var state = 'playing';   // 'playing' | 'over'
  var dropTimer = 0;
  var softDrop = false;
  var lastFrame = 0;

  // --- Поле -----------------------------------------------------------------
  function createBoard() {
    var rows = [];
    for (var y = 0; y < ROWS; y++) {
      var row = [];
      for (var x = 0; x < COLS; x++) row.push(null);
      rows.push(row);
    }
    return rows;
  }

  function copyMatrix(shape) {
    var matrix = [];
    for (var y = 0; y < shape.length; y++) {
      matrix.push(shape[y].split(''));
    }
    return matrix;
  }

  // «Мешок» из семи фигур: каждая выпадает по разу, прежде чем повториться.
  function nextType() {
    if (bag.length === 0) {
      bag = Object.keys(SHAPES);
      for (var i = bag.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = bag[i];
        bag[i] = bag[j];
        bag[j] = tmp;
      }
    }
    return bag.pop();
  }

  function createPiece(type) {
    var matrix = copyMatrix(SHAPES[type]);
    return {
      type: type,
      matrix: matrix,
      x: Math.floor((COLS - matrix.length) / 2),
      y: 0
    };
  }

  // Может ли фигура стоять в позиции (px, py)?
  function collides(matrix, px, py) {
    for (var y = 0; y < matrix.length; y++) {
      for (var x = 0; x < matrix[y].length; x++) {
        if (matrix[y][x] === '.') continue;

        var bx = px + x;
        var by = py + y;

        if (bx < 0 || bx >= COLS || by >= ROWS) return true;
        if (by >= 0 && board[by][bx]) return true;
      }
    }
    return false;
  }

  // --- Движение и поворот ---------------------------------------------------
  function move(dx) {
    if (state !== 'playing' || !piece) return;
    if (!collides(piece.matrix, piece.x + dx, piece.y)) {
      piece.x += dx;
    }
  }

  function rotateMatrix(matrix) {
    var n = matrix.length;
    var rotated = [];
    for (var y = 0; y < n; y++) {
      var row = [];
      for (var x = 0; x < n; x++) {
        row.push(matrix[n - 1 - x][y]);
      }
      rotated.push(row);
    }
    return rotated;
  }

  function rotate() {
    if (state !== 'playing' || !piece) return;

    var rotated = rotateMatrix(piece.matrix);
    var kicks = [0, -1, 1, -2, 2];   // простые «пинки» от стен

    for (var i = 0; i < kicks.length; i++) {
      if (!collides(rotated, piece.x + kicks[i], piece.y)) {
        piece.matrix = rotated;
        piece.x += kicks[i];
        return;
      }
    }
  }

  // --- Падение, фиксация, линии --------------------------------------------
  function stepDown() {
    if (!collides(piece.matrix, piece.x, piece.y + 1)) {
      piece.y += 1;
    } else {
      lockPiece();
    }
  }

  function merge() {
    for (var y = 0; y < piece.matrix.length; y++) {
      for (var x = 0; x < piece.matrix[y].length; x++) {
        if (piece.matrix[y][x] === '.') continue;
        board[piece.y + y][piece.x + x] = piece.type;
      }
    }
  }

  // Убирает заполненные ряды и возвращает их количество.
  function clearLines() {
    var cleared = 0;

    for (var y = ROWS - 1; y >= 0; y--) {
      var full = true;
      for (var x = 0; x < COLS; x++) {
        if (!board[y][x]) {
          full = false;
          break;
        }
      }

      if (full) {
        board.splice(y, 1);
        board.unshift(createEmptyRow());
        cleared += 1;
        y += 1;   // на этом месте теперь новый ряд — проверим его снова
      }
    }

    return cleared;
  }

  function createEmptyRow() {
    var row = [];
    for (var x = 0; x < COLS; x++) row.push(null);
    return row;
  }

  function lockPiece() {
    merge();

    var cleared = clearLines();
    if (cleared > 0) {
      score += LINE_SCORES[cleared];
      lines += cleared;
      updateHud();
    }

    spawnPiece();
  }

  function spawnPiece() {
    piece = createPiece(nextType());
    dropTimer = 0;

    // Новая фигура не поместилась — шахта заполнена, игра окончена.
    if (collides(piece.matrix, piece.x, piece.y)) {
      piece = null;
      gameOver();
    }
  }

  function gameOver() {
    state = 'over';
    softDrop = false;
    overlayText.textContent = 'ДУБЛОНОВ ' + score + ' · ПАЛУБ ' + lines;
    overlay.hidden = false;
  }

  function startGame() {
    board = createBoard();
    score = 0;
    lines = 0;
    dropTimer = 0;
    softDrop = false;
    state = 'playing';

    overlay.hidden = true;
    startBtn.blur();
    updateHud();
    spawnPiece();
  }

  function updateHud() {
    scoreEl.textContent = String(score);
    linesEl.textContent = String(lines);
  }

  // --- Логика кадра ---------------------------------------------------------
  function update(dt) {
    if (state !== 'playing' || !piece) return;

    dropTimer += dt;
    var interval = softDrop ? SOFT_INTERVAL : DROP_INTERVAL;

    if (dropTimer >= interval) {
      dropTimer = 0;
      stepDown();
    }
  }

  // --- Отрисовка ------------------------------------------------------------
  function drawBlock(cx, cy, type) {
    var colors = COLORS[type];
    var x = cx * CELL;
    var y = cy * CELL;

    ctx.fillStyle = colors.dark;
    ctx.fillRect(x, y, CELL, CELL);

    ctx.fillStyle = colors.base;
    ctx.fillRect(x + 2, y + 2, CELL - 4, CELL - 4);

    ctx.fillStyle = colors.light;
    ctx.fillRect(x + 2, y + 2, CELL - 4, 3);
    ctx.fillRect(x + 2, y + 2, 3, CELL - 4);

    drawMotif(type, x, y);
  }

  // --- Пиратские мотивы на блоках ------------------------------------------
  // У каждой фигуры свой узнаваемый символ: флаг, монета, череп, карта,
  // сабля, якорь и компас.
  function drawMotif(type, x, y) {
    var cx = x + CELL / 2;
    var cy = y + CELL / 2;

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (type === 'I') {
      drawFlag(x, y);
    } else if (type === 'O') {
      drawCoin(cx, cy);
    } else if (type === 'T') {
      drawSkull(cx, y);
    } else if (type === 'S') {
      drawMap(x, y);
    } else if (type === 'Z') {
      drawCutlass(x, y);
    } else if (type === 'J') {
      drawAnchor(cx, y);
    } else if (type === 'L') {
      drawCompass(cx, cy);
    }

    ctx.restore();
  }

  // Флаг на древке с черепом
  function drawFlag(x, y) {
    ctx.fillStyle = COLORS.I.icon;
    ctx.fillRect(x + 7, y + 5, 2, 15);

    ctx.beginPath();
    ctx.moveTo(x + 9, y + 5);
    ctx.lineTo(x + 19, y + 8);
    ctx.lineTo(x + 9, y + 11);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = COLORS.I.dark;
    ctx.fillRect(x + 11, y + 7, 2, 2);
  }

  // Золотая монета с крестом
  function drawCoin(cx, cy) {
    ctx.beginPath();
    ctx.arc(cx, cy, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#f4d47a';
    ctx.fill();

    ctx.strokeStyle = COLORS.O.icon;
    ctx.lineWidth = 1.6;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx - 3, cy - 3);
    ctx.lineTo(cx + 3, cy + 3);
    ctx.moveTo(cx + 3, cy - 3);
    ctx.lineTo(cx - 3, cy + 3);
    ctx.stroke();
  }

  // Череп с глазницами и зубами
  function drawSkull(cx, y) {
    ctx.fillStyle = COLORS.T.icon;
    ctx.beginPath();
    ctx.arc(cx, y + 10, 5.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(cx - 3.6, y + 12, 7.2, 5);

    ctx.fillStyle = COLORS.T.dark;
    ctx.fillRect(cx - 3.4, y + 8.2, 2.2, 2.4);
    ctx.fillRect(cx + 1.2, y + 8.2, 2.2, 2.4);

    ctx.beginPath();
    ctx.moveTo(cx, y + 11.4);
    ctx.lineTo(cx - 1.1, y + 13.4);
    ctx.lineTo(cx + 1.1, y + 13.4);
    ctx.closePath();
    ctx.fill();

    ctx.fillRect(cx - 2.6, y + 14.4, 1, 2.2);
    ctx.fillRect(cx - 0.5, y + 14.4, 1, 2.2);
    ctx.fillRect(cx + 1.6, y + 14.4, 1, 2.2);
  }

  // Клочок карты с пунктирным маршрутом и красным крестом
  function drawMap(x, y) {
    ctx.fillStyle = COLORS.S.icon;
    ctx.fillRect(x + 6, y + 5.5, 12, 13);

    ctx.strokeStyle = COLORS.S.dark;
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 6.5, y + 6, 11, 12);

    ctx.setLineDash([2, 2]);
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(x + 8, y + 16.5);
    ctx.lineTo(x + 10.5, y + 13);
    ctx.lineTo(x + 9.5, y + 10);
    ctx.lineTo(x + 13.5, y + 9);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.strokeStyle = '#b5482f';
    ctx.lineWidth = 1.7;
    ctx.beginPath();
    ctx.moveTo(x + 12, y + 7);
    ctx.lineTo(x + 16.5, y + 11.5);
    ctx.moveTo(x + 16.5, y + 7);
    ctx.lineTo(x + 12, y + 11.5);
    ctx.stroke();
  }

  // Абордажная сабля
  function drawCutlass(x, y) {
    ctx.strokeStyle = COLORS.Z.icon;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(x + 8, y + 16.5);
    ctx.quadraticCurveTo(x + 13, y + 11, x + 18, y + 5.5);
    ctx.stroke();

    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + 5.5, y + 14.5);
    ctx.lineTo(x + 9.5, y + 18.5);
    ctx.stroke();

    ctx.strokeStyle = '#3f2515';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x + 4.5, y + 19.5);
    ctx.lineTo(x + 7, y + 17);
    ctx.stroke();
  }

  // Якорь с кольцом, штоком и лапами
  function drawAnchor(cx, y) {
    ctx.strokeStyle = COLORS.J.icon;
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.arc(cx, y + 6.2, 2.4, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx, y + 8.6);
    ctx.lineTo(cx, y + 18.6);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx - 5, y + 11.2);
    ctx.lineTo(cx + 5, y + 11.2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx - 6.4, y + 13.6);
    ctx.quadraticCurveTo(cx, y + 21.6, cx + 6.4, y + 13.6);
    ctx.stroke();
  }

  // Компас с красно-белой стрелкой
  function drawCompass(cx, cy) {
    ctx.strokeStyle = COLORS.L.icon;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(cx, cy, 7.2, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = '#e0714a';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 5.8);
    ctx.lineTo(cx - 2.6, cy);
    ctx.lineTo(cx + 2.6, cy);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = COLORS.L.icon;
    ctx.beginPath();
    ctx.moveTo(cx, cy + 5.8);
    ctx.lineTo(cx - 2.6, cy);
    ctx.lineTo(cx + 2.6, cy);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = COLORS.L.dark;
    ctx.fillRect(cx - 1, cy - 1, 2, 2);
  }

  // Едва заметная роза ветров на дне шахты — поле похоже на старую карту
  function drawBackdrop() {
    var cx = W / 2;
    var cy = H * 0.56;
    var i;
    var a;

    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.strokeStyle = '#7a4f2a';
    ctx.lineWidth = 1.5;

    // два кольца
    ctx.beginPath();
    ctx.arc(cx, cy, 54, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, 44, 0, Math.PI * 2);
    ctx.stroke();

    // деления по восьми направлениям
    for (i = 0; i < 8; i++) {
      a = i * Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * 44, cy + Math.sin(a) * 44);
      ctx.lineTo(cx + Math.cos(a) * 50, cy + Math.sin(a) * 50);
      ctx.stroke();
    }

    // четырёхлучевая роза ветров
    ctx.beginPath();
    ctx.moveTo(cx, cy - 36);
    ctx.lineTo(cx + 7, cy - 7);
    ctx.lineTo(cx + 36, cy);
    ctx.lineTo(cx + 7, cy + 7);
    ctx.lineTo(cx, cy + 36);
    ctx.lineTo(cx - 7, cy + 7);
    ctx.lineTo(cx - 36, cy);
    ctx.lineTo(cx - 7, cy - 7);
    ctx.closePath();
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = '#7a4f2a';
    ctx.fill();

    ctx.restore();
  }

  function drawGrid() {
    ctx.strokeStyle = 'rgba(122, 88, 52, 0.16)';
    ctx.lineWidth = 1;
    ctx.beginPath();

    for (var x = 1; x < COLS; x++) {
      ctx.moveTo(x * CELL + 0.5, 0);
      ctx.lineTo(x * CELL + 0.5, H);
    }
    for (var y = 1; y < ROWS; y++) {
      ctx.moveTo(0, y * CELL + 0.5);
      ctx.lineTo(W, y * CELL + 0.5);
    }

    ctx.stroke();
  }

  function render() {
    ctx.fillStyle = '#fbf3e2';
    ctx.fillRect(0, 0, W, H);

    drawBackdrop();
    drawGrid();

    // Упавшие блоки
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        if (board[y][x]) drawBlock(x, y, board[y][x]);
      }
    }

    // Текущая фигура
    if (piece && state === 'playing') {
      for (var py = 0; py < piece.matrix.length; py++) {
        for (var px = 0; px < piece.matrix[py].length; px++) {
          if (piece.matrix[py][px] === '.') continue;
          drawBlock(piece.x + px, piece.y + py, piece.type);
        }
      }
    }
  }

  // --- Управление -----------------------------------------------------------
  function onKeyDown(event) {
    if (event.code === 'ArrowLeft' || event.code === 'KeyA') {
      event.preventDefault();
      move(-1);
    } else if (event.code === 'ArrowRight' || event.code === 'KeyD') {
      event.preventDefault();
      move(1);
    } else if (event.code === 'ArrowUp' || event.code === 'KeyW') {
      event.preventDefault();
      if (!event.repeat) rotate();
    } else if (event.code === 'ArrowDown' || event.code === 'KeyS') {
      event.preventDefault();
      softDrop = true;
    } else if (event.code === 'Space' || event.code === 'Enter') {
      // Пробел не должен прокручивать страницу
      event.preventDefault();
      if (state === 'over') startGame();
    }
  }

  function onKeyUp(event) {
    if (event.code === 'ArrowDown' || event.code === 'KeyS') {
      softDrop = false;
    }
  }

  // Если окно потеряло фокус, ускорение падения не должно «залипнуть»
  function onBlur() {
    softDrop = false;
  }

  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', onBlur);

  startBtn.addEventListener('click', function (event) {
    event.preventDefault();
    startGame();
  });

  // --- Главный цикл ---------------------------------------------------------
  function loop(now) {
    if (!lastFrame) lastFrame = now;
    var dt = (now - lastFrame) / 1000;
    lastFrame = now;

    // Защита от огромного шага после переключения вкладки
    if (dt > 0.05) dt = 0.05;

    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  // Игра начинается сразу: пустая шахта и первая фигура сверху.
  startGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
